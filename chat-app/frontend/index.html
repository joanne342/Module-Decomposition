
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033">
  <title>Gather — Group Chat</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">YOUR COMMUNITY</p>
        <h1>Gather <span aria-hidden="true">✳</span></h1>
        <p class="subtitle">Good conversations start here.</p>
      </div>
      <div id="connection" class="connection" role="status">
        Connecting…
      </div>
    </header>

    <section class="chat-panel" aria-label="Group chat">
      <div class="chat-toolbar">
        <div>
          <h2>Messages</h2>
          <p>Be kind. Keep it useful.</p>
        </div>
        <span id="message-count" class="count">0 messages</span>
      </div>

      <div id="messages" class="messages"
           role="log" aria-live="polite"
           aria-relevant="additions text">
        <p id="empty-state" class="empty-state">
          No messages yet. Start the conversation!
        </p>
      </div>

      <div id="reply-preview" class="reply-preview" hidden>
        <div class="reply-copy">
          <span class="reply-label">REPLYING TO</span>
          <span id="reply-summary"></span>
        </div>
        <button id="cancel-reply" class="icon-button"
                type="button" aria-label="Cancel reply">×</button>
      </div>

      <form id="chat-form" class="composer">
        <label class="sr-only" for="username">Your name</label>
        <input id="username" name="username"
               maxlength="30" minlength="2"
               placeholder="Your name" autocomplete="nickname"
               required>

        <div class="compose-row">
          <label class="sr-only" for="message">Your message</label>
          <textarea id="message" name="message"
                    rows="2" maxlength="1000"
                    placeholder="Write a message…"
                    required></textarea>
          <button id="send-button" class="send-button"
                  type="submit" disabled>Send ↗</button>
        </div>

        <div class="composer-footer">
          <span>Up to 1,000 characters</span>
          <span id="feedback" role="status"></span>
        </div>
      </form>
    </section>

    <footer class="footer">
      Built for learning, collaboration and good conversations.
    </footer>
  </main>
</body>
</html>
